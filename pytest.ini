[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -q: salida compacta. --strict-markers: un marcador mal escrito falla en vez de
# ignorarse silenciosamente (evita tests que creemos que corren y no corren).
addopts = -q --strict-markers

markers =
    contable: reglas contables (partida doble, IVA, tributos) — lo más crítico
    parser: extracción de datos del XML/PDF de la DIAN
    clasificacion: clasificación de documentos y tributos
