services:
  postgres:
    image: postgres:16-alpine
    container_name: ciolix_postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ciolix_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENV: production
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Ciolix}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_TLS: ${MAIL_TLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    command:
      - sh
      - -c
      - >-
        until python -c "import socket; socket.create_connection(('postgres', 5432), 2)" 2>/dev/null;
        do sleep 2; done &&
        alembic upgrade head &&
        uvicorn api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    volumes:
      - api_data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: ciolix_caddy
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # El hash del Studio va en base64 (sin '$') porque Portainer corrompe los
      # '$' de un bcrypt crudo. Se decodifica en el arranque (ver command) y
      # Caddy lo lee via {$STUDIO_PASSWORD_HASH}.
      - STUDIO_PASSWORD_HASH_B64
    ports:
      - "80:80"
      - "443:443"
    entrypoint: ["sh", "-c"]
    command:
      - |
        export STUDIO_PASSWORD_HASH="$$(printenv STUDIO_PASSWORD_HASH_B64 | base64 -d)"
        cat > /etc/caddy/Caddyfile <<'EOF'
        ${DUCKDNS_DOMAIN} {
            reverse_proxy api:8000
        }

        # --- POS Esencial: la API (Supabase autohospedado) ---
        brunoise-api.duckdns.org {
            encode zstd gzip
            reverse_proxy pos_kong:8000 {
                header_up Host {host}
                header_up X-Real-IP {remote_host}
                # El POS vive de WebSockets: salón, cocina, cuentas y cajas se
                # actualizan solos por ahí. Sin quitar los tiempos de espera,
                # Caddy corta la conexión al minuto y todo deja de moverse sin
                # que se vea ningún error.
                transport http {
                    read_timeout 0
                    write_timeout 0
                }
            }
        }
        EOF
        # El Studio se agrega SOLO si el hash es un bcrypt válido ($2...). Si
        # falta o llega corrupto, se omite brunoise-db y Caddy arranca igual:
        # un problema del POS nunca debe tumbar ciolix ni brunoise-api.
        case "$$STUDIO_PASSWORD_HASH" in
        '$$2'*)
        cat >> /etc/caddy/Caddyfile <<'EOF2'

        # --- POS Esencial: Studio, con usuario y contraseña ---
        brunoise-db.duckdns.org {
            encode zstd gzip
            basic_auth {
                admin {$$STUDIO_PASSWORD_HASH}
            }
            reverse_proxy pos_studio:3000
        }
        EOF2
        ;;
        *)
        echo "AVISO: STUDIO_PASSWORD_HASH ausente o inválido; se omite brunoise-db (Studio)." ;;
        esac
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks: [default, edge]
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: ciolix_duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false

volumes:
  postgres_data:
  api_data:
  caddy_data:
  caddy_config:

networks:
  default:
  edge:
    external: true